<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التحصيل</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e3a5f; min-height: 100vh; padding: 20px; }
      .header { text-align: center; padding: 30px 0; }
      .logo { font-size: 48px; font-weight: bold; color: #ffd700; font-family: 'Arial Black', sans-serif; }
      .form-title { color: white; font-size: 32px; margin-top: 15px; }
      .form-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 40px; }
      .form-group { margin-bottom: 25px; }
      label { display: block; margin-bottom: 8px; font-size: 16px; color: #333; }
      .required { color: #dc3545; margin-right: 5px; }
      input[type="text"], select { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
      input[type="text"]:focus, select:focus { outline: none; border-color: #1e3a5f; }
      .submit-btn { background-color: #a8c5da; color: #333; border: none; padding: 15px 40px; font-size: 16px; border-radius: 6px; cursor: pointer; }
      .submit-btn:hover { background-color: #8fb5ce; }
      .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }
      .location-status { font-size: 12px; color: #666; margin-top: 5px; }
      .location-status.success { color: #28a745; }
      .location-status.error { color: #dc3545; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">Rizkalla</div>
      <h1 class="form-title">نموذج التحصيل</h1>
    </div>

    <div class="form-container">
      <form id="collectionForm">
        <div class="form-group">
          <label>
            <span class="required">*</span>
            نوع الزيارة
          </label>
          <select name="visitType" required>
            <option value="">اختر...</option>
            <option value="Buyer">العميل (المشتري)</option>
            <option value="Guarantor">الضامن</option>
            <option value="Father">الأب</option>
            <option value="Mother">الأم</option>
            <option value="Husband">الزوج</option>
            <option value="Wife">الزوجة</option>
            <option value="Brother">الأخ</option>
            <option value="Sister">الأخت</option>
            <option value="Relative">قريب</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            اسم المحصل
          </label>
          <select name="collectorName" required>
            <option value="">اختر...</option>
            <option value="ابانوب صفوت اسكندريه">ابانوب صفوت اسكندريه</option>
            <option value="اسلام عبد الستار محمد">اسلام عبد الستار محمد</option>
            <option value="انجلو بهجت اسيوط">انجلو بهجت اسيوط</option>
            <option value="انس محمود اسكندريه">انس محمود اسكندريه</option>
            <option value="بيشوي عبيد اسكندريه">بيشوي عبيد اسكندريه</option>
            <option value="تامر اميل">تامر اميل</option>
            <option value="جون جبرائيل ابراهيم">جون جبرائيل ابراهيم</option>
            <option value="جون ميشيل بقطر">جون ميشيل بقطر</option>
            <option value="رامي موريس اسكندريه">رامي موريس اسكندريه</option>
            <option value="روفائيل صليب">روفائيل صليب</option>
            <option value="ريمون النوبي">ريمون النوبي</option>
            <option value="ريمون حنا تاوضروس">ريمون حنا تاوضروس</option>
            <option value="سوزيف عاطف مكير">سوزيف عاطف مكير</option>
            <option value="شادى سعيد سعد فريج">شادى سعيد سعد فريج</option>
            <option value="شريف عواد السيد">شريف عواد السيد</option>
            <option value="شنوده قنا">شنوده قنا</option>
            <option value="عبد المحسن اسماعيل عبد القادر">عبد المحسن اسماعيل عبد القادر</option>
            <option value="عماد محسن جرجس">عماد محسن جرجس</option>
            <option value="عمرو علي حسن">عمرو علي حسن</option>
            <option value="كريم احمد محمد">كريم احمد محمد</option>
            <option value="مايكل مسعود راشد">مايكل مسعود راشد</option>
            <option value="محمد شوقي جمال">محمد شوقي جمال</option>
            <option value="محمد علاء بورسعيد">محمد علاء بورسعيد</option>
            <option value="محمد علي محمد علي">محمد علي محمد علي</option>
            <option value="محمد غانم">محمد غانم</option>
            <option value="محمود ياسين">محمود ياسين</option>
            <option value="مدحت لويز فرنسيس">مدحت لويز فرنسيس</option>
            <option value="مرقص موريس اسكندريه">مرقص موريس اسكندريه</option>
            <option value="هاني عبد الملاك">هاني عبد الملاك</option>
            <option value="وسيم بلبل اسكندريه">وسيم بلبل اسكندريه</option>
            <option value="وليد محمد عبد الحميد جرجا">وليد محمد عبد الحميد جرجا</option>
            <option value="محمد اسماعيل">محمد اسماعيل</option>
            <option value="احمد ابراهيم يوسف">احمد ابراهيم يوسف</option>
            <option value="اسلام محسن">اسلام محسن</option>
            <option value="حمدي منصور">حمدي منصور</option>
            <option value="خالد ثروت">خالد ثروت</option>
            <option value="عبد الرحمن منصور">عبد الرحمن منصور</option>
            <option value="محمد اسامه">محمد اسامه</option>
            <option value="محمد اسماعيل">محمد اسماعيل</option>
            <option value="محمد هلال">محمد هلال</option>
            <option value="ميشيل صادق">ميشيل صادق</option>
            <option value="نشات مهدي">نشات مهدي</option>
            <option value="هشام صلاح">هشام صلاح</option>
            <option value="خليفه محمد">خليفه محمد</option>
            <option value="هاني رامي">هاني رامي</option>
            <option value="عبد الرحمن محمد السيد خليفه">عبد الرحمن محمد السيد خليفه</option>
            <option value="عبد الرحمن محمد عبد الرحمن">عبد الرحمن محمد عبد الرحمن</option>
            <option value="محمد محمد انور">محمد محمد انور</option>
            <option value="كيرلس حنا">كيرلس حنا</option>
            <option value="هاني ذكري">هاني ذكري</option>
            <option value="ايمن مدحت">ايمن مدحت</option>
            <option value="جورج كامل عبد السيد">جورج كامل عبد السيد</option>
            <option value="ابانوب عبد الملاك">ابانوب عبد الملاك</option>
            <option value="مهاب رضا">مهاب رضا</option>
            <option value="AC1">AC1</option>
            <option value="EN1">EN1</option>
            <option value="MAS1">MAS1</option>
            <option value="MON1">MON1</option>
            <option value="UD1">UD1</option>
            <option value="TY1">TY1</option>
            <option value="Pro1">Pro1</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            رقم البطاقة
          </label>
          <input type="text" name="cardNumber" required placeholder="أدخل رقم البطاقة" inputmode="numeric" pattern="[0-9]{14}" maxlength="14" minlength="14" title="رقم البطاقة يجب أن يكون 14 رقمًا">
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            الحالة
          </label>
          <select name="status" required>
            <option value="">اختر...</option>
            <option value="Temporary">مؤقت</option>
            <option value="Successful">ناجح</option>
            <option value="Failed">غير ناجح</option>
            <option value="Regular Client">عميل منتظم</option>
            <option value="Struggling Client">عميل متعثر</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            ملاحظة
          </label>
          <input type="text" name="comment" required placeholder="أضف ملاحظة عن الزيارة">
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            العنوان
          </label>
          <input type="text" name="address" required placeholder="أدخل العنوان">
        </div>

        <input type="hidden" name="location" id="locationField">

        <div id="locationStatus" class="location-status" role="status" aria-live="polite"></div>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>إرسال</button>
      </form>
    </div>

    <script>
      // الحصول على الموقع عند تحميل الصفحة
      window.onload = function() {
        getLocation();
        var cardInput = document.querySelector('[name="cardNumber"]');
        cardInput.addEventListener('input', function() {
          this.value = this.value.replace(/\D/g, '').slice(0, 14);
        });
      };

      function getLocation() {
        var statusEl = document.getElementById('locationStatus');
        var locationField = document.getElementById('locationField');
        var submitBtn = document.getElementById('submitBtn');

        locationField.value = '';
        submitBtn.disabled = true;

        if (!navigator.geolocation) {
          statusEl.textContent = 'المتصفح لا يدعم تحديد الموقع الجغرافي - لا يمكن إرسال النموذج';
          statusEl.className = 'location-status error';
          return;
        }

        statusEl.textContent = 'جارٍ الحصول على الموقع...';
        statusEl.className = 'location-status';

        navigator.geolocation.getCurrentPosition(
          function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            locationField.value = lng + ',' + lat;
            statusEl.textContent = 'تم الحصول على الموقع';
            statusEl.className = 'location-status success';
            submitBtn.disabled = false;
          },
          function(error) {
            statusEl.textContent = 'تعذّر الحصول على الموقع - يرجى تفعيل إذن الموقع وإعادة المحاولة';
            statusEl.className = 'location-status error';
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }

      document.getElementById('collectionForm').onsubmit = function(e) {
        e.preventDefault();
        var submitBtn = document.getElementById('submitBtn');
        var locationValue = document.getElementById('locationField').value;

        if (!locationValue) {
          alert('تعذّر الحصول على الموقع - لا يمكن إرسال النموذج');
          return;
        }

        var cardNumberValue = document.querySelector('[name="cardNumber"]').value;
        if (!/^\d{14}$/.test(cardNumberValue)) {
          alert('رقم البطاقة يجب أن يكون 14 رقمًا');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'جارٍ الإرسال...';

        var formData = {
          visitType: document.querySelector('[name="visitType"]').value,
          collectorName: document.querySelector('[name="collectorName"]').value,
          cardNumber: document.querySelector('[name="cardNumber"]').value,
          status: document.querySelector('[name="status"]').value,
          comment: document.querySelector('[name="comment"]').value,
          address: document.querySelector('[name="address"]').value,
          location: locationValue
        };

        fetch('https://us-central1-rizpay-abb7d.cloudfunctions.net/collectionTicketSubmit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        })
        .then(function(response) {
          if (response.ok) {
            alert('تم إرسال النموذج بنجاح!');
            document.getElementById('collectionForm').reset();
            getLocation();
          } else {
            alert('حدث خطأ أثناء إرسال النموذج');
          }
        })
        .catch(function(error) {
          alert('خطأ: ' + error.message);
        })
        .finally(function() {
          submitBtn.disabled = false;
          submitBtn.textContent = 'إرسال';
        });
      };
    </script>
  </body>
</html>
